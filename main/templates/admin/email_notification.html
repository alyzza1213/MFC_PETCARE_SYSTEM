{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | MFC Pet Life</title>

    <link rel="stylesheet" href="{% static 'css/admin/admin_dashboard.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div>
            <h2>🐾 MFC Pet Life</h2>

            <div class="nav-links">
                <a href="{% url 'admin_dashboard' %}" >Dashboard</a>
                <a href="{% url 'clients_pets' %}">Clients & Pets</a>
                <a href="{% url 'vet_availability_admin' %}">Vet Availability</a>
                <a href="{% url 'appointment_requests' %}">Appointment Requests</a>
                <a href="{% url 'payments_admin' %}">Payments</a>
                <a href="{% url 'service_list' %}">Service List</a>
                <a href="{% url 'gcash_qr' %}">Gcash QR Code</a>
                <a href="{% url 'email_notification' %}"class="active">Email Notifications</a>
                <a href="{% url 'reports_admin' %}">Reports</a>
                <a href="{% url 'settings_admin' %}">Settings</a>
            </div>
        </div>


            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Log Out</button>
            </form>
        </div>
    </div>

    <!-- MAIN -->
<div class="main-content" style="margin-left:260px; padding:30px; font-family:Poppins;">

    <h1>Email Notifications</h1>

    <form method="POST" style="background:white;padding:20px;border-radius:10px;width:400px;">
        {% csrf_token %}

        <label>Email:</label>
        <input type="email" name="email" required style="width:100%;padding:10px;margin-bottom:10px;">

        <label>Subject:</label>
        <input type="text" name="subject" required style="width:100%;padding:10px;margin-bottom:10px;">

        <label>Message:</label>
        <textarea name="message" rows="5" required style="width:100%;padding:10px;"></textarea>

        <button type="submit" style="margin-top:10px;background:#2e7d73;color:white;padding:10px;width:100%;border:none;">
            Send Email
        </button>
    </form>

</div>

</body>
</html>
